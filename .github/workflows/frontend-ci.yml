name: Frontend CI

on:
  push:
    branches: ["**"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  verificar:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build (incluye chequeo de tipos con tsc -b)
        run: npm run build

      # El equivalente del chequeo de contrato que hace backend-ci, visto
      # desde este lado: si `backend/openapi.yaml` cambió y nadie regeneró
      # `src/api/schema.ts`, el frontend estaría compilando contra un
      # contrato viejo y el error saldría en runtime, no acá.
      - name: Verificar que los tipos del contrato están al día
        run: |
          npm run generate:types
          if ! git diff --exit-code -- src/api/schema.ts; then
            echo "::error::src/api/schema.ts está desactualizado respecto a backend/openapi.yaml." \
              "Regeneralo con: npm run generate:types"
            exit 1
          fi
