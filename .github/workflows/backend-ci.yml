name: Backend CI

on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: turnio
          POSTGRES_USER: turnio
          POSTGRES_PASSWORD: turnio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turnio -d turnio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-only-secret-key-not-for-production
      DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: turnio
      POSTGRES_USER: turnio
      POSTGRES_PASSWORD: turnio
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Chequear que no falten migraciones
        run: python manage.py makemigrations --check --dry-run

      - name: Aplicar migraciones
        run: python manage.py migrate --noinput

      - name: Verificar que el contrato OpenAPI está al día
        run: |
          python manage.py spectacular --file /tmp/openapi-generado.yaml --validate
          if ! diff -u openapi.yaml /tmp/openapi-generado.yaml; then
            echo "::error::backend/openapi.yaml está desactualizado respecto al código." \
              "Regeneralo con: docker compose run --rm --user \"\$(id -u):\$(id -g)\" backend python manage.py spectacular --file openapi.yaml --validate" \
              "y anota el cambio en CONTRATO.md."
            exit 1
          fi

      - name: Tests
        run: pytest
