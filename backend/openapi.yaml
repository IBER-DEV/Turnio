  /api/negocios/empleados/:
    get:
      operationId: negocios_empleados_list
      description: |-
        Lista o agrega empleados del negocio del usuario autenticado.

        Endpoint de **gestión**: expone email y capacidades de cada miembro,
        así que exige `puede_gestionar_empleados` también para listar, no
        solo para crear. Quien solo necesita saber quiénes son sus
        compañeros (la agenda) usa `GET /api/negocios/equipo/`, que
        devuelve una vista mínima sin datos personales.

        El queryset se filtra siempre por el negocio de la membresía activa
        del solicitante: nunca se exponen empleados de otro tenant.
      tags:
      - negocios
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MiembroNegocio'
          description: ''
    post:
      operationId: negocios_empleados_create
      description: |-
        Lista o agrega empleados del negocio del usuario autenticado.

        Endpoint de **gestión**: expone email y capacidades de cada miembro,
        así que exige `puede_gestionar_empleados` también para listar, no
        solo para crear. Quien solo necesita saber quiénes son sus
        compañeros (la agenda) usa `GET /api/negocios/equipo/`, que
        devuelve una vista mínima sin datos personales.

        El queryset se filtra siempre por el negocio de la membresía activa
        del solicitante: nunca se exponen empleados de otro tenant.
      tags:
      - negocios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpleadoAlta'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmpleadoAlta'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmpleadoAlta'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiembroNegocio'
          description: ''
  /api/negocios/empleados/{id}/:
