      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this servicio.
        required: true
      tags:
      - servicios
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Servicio'
          description: ''
    put:
      operationId: servicios_update
      description: |-
        CRUD de servicios del negocio del usuario autenticado.

