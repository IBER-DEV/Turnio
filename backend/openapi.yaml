  /api/agenda/horario-negocio/:
    get:
      operationId: agenda_horario_negocio_list
      description: |-
        Horario de atención del negocio del usuario autenticado.

        Es el horario que rige por defecto para todo el equipo: quien no tenga horario propio cargado trabaja este. Lo puede leer cualquier miembro.
      tags:
      - agenda
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HorarioNegocio'
          description: ''
    put:
      operationId: agenda_horario_negocio_update
      description: |-
        Reemplaza el horario de atención del negocio en una sola transacción. Requiere `puede_configurar_horarios` — decidir cuándo abre el local es una decisión distinta de operar la agenda del día.

        Cambiarlo acá cambia la disponibilidad de **todos** los empleados que lo heredan, que es el caso normal. Los que tienen horario propio (ver `PUT /api/agenda/horarios/semana/`) no se ven afectados.

        Semántica de **reemplazo**: las franjas enviadas pasan a ser el horario completo; lo que no venga se borra. Enviar `franjas: []` deja al negocio sin horario, y entonces nadie que herede tiene disponibilidad.
      tags:
      - agenda
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HorarioNegocioSemanal'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HorarioNegocioSemanal'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HorarioNegocioSemanal'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HorarioNegocio'
          description: ''
  /api/agenda/horarios/:
