          readOnly: true
        nombre:
          type: string
          readOnly: true
        descripcion:
          type: string
          readOnly: true
        categoria:
          type: string
          readOnly: true
        precio:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        duracion_minutos:
          type: integer
          readOnly: true
      required:
      - categoria
      - descripcion
      - duracion_minutos
      - id
      - nombre
      - precio
    TemaEnum:
      enum:
      - barberia
      - spa
      - clinica
      type: string
      description: |-
        * `barberia` - Barbería
        * `spa` - Spa y estética
        * `clinica` - Clínica y salud
    TipoEnum:
      enum:
