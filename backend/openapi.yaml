openapi: 3.0.3
info:
  title: Turnio API
  version: 0.1.0
  description: Contrato vivo entre el backend y el frontend de Turnio. Ver también
    /CONTRATO.md en la raíz del repo para convenciones que este schema no captura
    (auth, formato de errores, etc.).
paths:
  /api/agenda/citas/:
    get:
      operationId: agenda_citas_list
      description: |-
        Agenda: crear y consultar citas, y transicionar su estado.

        Crear requiere `puede_gestionar_agenda`. `empleado` es opcional al
        crear: si se omite, el servicio de agenda asigna automáticamente el
        primer empleado disponible ("cualquiera disponible").
      tags:
      - agenda
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cita'
          description: ''
    post:
      operationId: agenda_citas_create
      description: |-
        Agenda: crear y consultar citas, y transicionar su estado.

        Crear requiere `puede_gestionar_agenda`. `empleado` es opcional al
        crear: si se omite, el servicio de agenda asigna automáticamente el
        primer empleado disponible ("cualquiera disponible").
      tags:
      - agenda
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CitaCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CitaCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CitaCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cita'
          description: ''
  /api/agenda/citas/{id}/:
    get:
      operationId: agenda_citas_retrieve
      description: |-
        Agenda: crear y consultar citas, y transicionar su estado.

        Crear requiere `puede_gestionar_agenda`. `empleado` es opcional al
        crear: si se omite, el servicio de agenda asigna automáticamente el
        primer empleado disponible ("cualquiera disponible").
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this cita.
        required: true
      tags:
      - agenda
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
