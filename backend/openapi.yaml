      required:
      - email_dueno
      - nombre_dueno
      - nombre_negocio
      - password_dueno
    RegistroNegocioRespuesta:
      type: object
      description: Forma de la respuesta de POST /api/negocios/registro/.
      properties:
        negocio:
          $ref: '#/components/schemas/Negocio'
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - negocio
      - refresh
    RegistroServicio:
      type: object
      description: |-
        Un registro de servicio realizado: alta y consulta.

        `estado`, `aprobado_por` y `fecha_revision` son de solo lectura
        porque los fija el servidor a través de las acciones
        `aprobar`/`rechazar`, nunca el cliente.

        `empleado` es un caso especial: **casi siempre** lo fija el servidor
        también (ver `RegistroServicioViewSet.perform_create`), pero quien
        tiene `puede_aprobar_servicios` puede —y debe— elegir a nombre de
        quién registra, para dejar constancia de un servicio que un barbero
        sin acceso a la app no pudo cargar él mismo. Por eso viaja como
        campo normal (no en `read_only_fields`) y su exigencia se resuelve en
        `validate()`, según quién hace el request.
      properties:
        id:
          type: integer
          readOnly: true
        empleado:
          type: integer
          description: Quién realizó el servicio. Solo se puede elegir con `puede_aprobar_servicios`;
            sin esa capacidad, el campo se ignora y siempre queda el propio solicitante.
        empleado_nombre:
          type: string
          readOnly: true
        servicio:
          type: integer
        servicio_nombre:
          type: string
          readOnly: true
        nombre_cliente:
          type: string
          maxLength: 150
        telefono_cliente:
          type: string
          maxLength: 30
        fecha_hora:
          type: string
          format: date-time
          description: Cuándo ocurrió el servicio. No puede ser futura.
        observaciones:
          type: string
        evidencia:
          type: string
          format: uri
          nullable: true
        estado:
          allOf:
          - $ref: '#/components/schemas/RegistroServicioEstadoEnum'
          readOnly: true
        aprobado_por:
          type: integer
          readOnly: true
          nullable: true
        aprobado_por_nombre:
          type: string
          readOnly: true
          nullable: true
        fecha_revision:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        motivo_rechazo:
          type: string
          readOnly: true
        creado_en:
          type: string
          format: date-time
          readOnly: true
      required:
      - aprobado_por
      - aprobado_por_nombre
      - creado_en
      - empleado_nombre
      - estado
      - fecha_hora
      - fecha_revision
      - id
      - motivo_rechazo
      - nombre_cliente
      - servicio
      - servicio_nombre
    RegistroServicioEstadoEnum:
      enum:
      - pendiente
      - aprobado
      - rechazado
      type: string
      description: |-
        * `pendiente` - Pendiente
        * `aprobado` - Aprobado
        * `rechazado` - Rechazado
    Reserva:
      type: object
      description: |-
        Lo que manda un cliente para reservar. Sin cuenta: nombre y teléfono.

        `empleado` es opcional — si el cliente eligió a alguien, se respeta; si
        no, se le asigna quien esté libre.
      properties:
        servicio:
          type: integer
        fecha_hora_inicio:
          type: string
          format: date-time
        nombre_cliente:
          type: string
          maxLength: 150
        telefono_cliente:
          type: string
          maxLength: 30
        empleado:
          type: integer
          nullable: true
        notas:
          type: string
          default: ''
          maxLength: 500
      required:
      - fecha_hora_inicio
      - nombre_cliente
      - servicio
      - telefono_cliente
    ReservaConfirmada:
      type: object
      description: |-
        Lo que se le devuelve al cliente tras reservar.

        Deliberadamente magro: confirma lo suyo y nada del negocio. No lleva el
        `id` de la cita porque hoy no hay nada que el cliente pueda hacer con
        él —cancelar sin cuenta requeriría un token de acceso, que es una
        decisión aparte— y un id expuesto sin uso solo invita a probar otros.
      properties:
        negocio:
          type: string
        servicio:
          type: string
        profesional:
          type: string
        fecha_hora_inicio:
          type: string
          format: date-time
        fecha_hora_fin:
          type: string
          format: date-time
        nombre_cliente:
          type: string
      required:
      - fecha_hora_fin
      - fecha_hora_inicio
      - negocio
      - nombre_cliente
      - profesional
      - servicio
    Servicio:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 150
        descripcion:
          type: string
        categoria:
          type: string
          maxLength: 100
        precio:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        duracion_minutos:
          type: integer
          maximum: 2147483647
          minimum: 0
        porcentaje_comision:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        activo:
          type: boolean
      required:
      - duracion_minutos
      - id
      - nombre
      - precio
    ServicioLote:
      type: object
      description: |-
        Entrada de `POST /api/servicios/lote/`.

        Se creó como endpoint aparte en vez de aceptar una lista en el `POST`
        normal para no volver ambiguo el body de creación de a uno: el
        schema OpenAPI quedaría con un `oneOf` que el frontend tendría que
