        required: true
      tags:
      - servicios
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    Cita:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        servicio:
          type: integer
        servicio_nombre:
          type: string
          readOnly: true
        empleado:
          type: integer
        empleado_nombre:
          type: string
          readOnly: true
        fecha_hora_inicio:
          type: string
          format: date-time
        fecha_hora_fin:
          type: string
          format: date-time
          readOnly: true
        estado:
          allOf:
          - $ref: '#/components/schemas/EstadoEnum'
          readOnly: true
        nombre_cliente:
          type: string
          maxLength: 150
        telefono_cliente:
          type: string
          maxLength: 30
        notas:
          type: string
      required:
      - empleado
      - empleado_nombre
      - estado
      - fecha_hora_fin
      - fecha_hora_inicio
      - id
      - nombre_cliente
      - servicio
      - servicio_nombre
    CitaCreate:
      type: object
      description: |-
        Entrada para agendar una cita. `empleado` es opcional: si se
        omite, se asigna automáticamente el primer empleado disponible.
      properties:
        servicio:
          type: integer
        empleado:
          type: integer
          nullable: true
        fecha_hora_inicio:
          type: string
          format: date-time
        nombre_cliente:
          type: string
          maxLength: 150
        telefono_cliente:
          type: string
          default: ''
          maxLength: 30
        notas:
          type: string
          default: ''
      required:
      - fecha_hora_inicio
      - nombre_cliente
      - servicio
    DiaSemanaEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
      description: |-
        * `0` - Lunes
        * `1` - Martes
        * `2` - Miércoles
        * `3` - Jueves
        * `4` - Viernes
        * `5` - Sábado
        * `6` - Domingo
    EmpleadoAlta:
      type: object
      description: Empleado adicional dado de alta junto con el registro del negocio.
      properties:
        email:
          type: string
          format: email
        nombre:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
        especialidad:
          type: string
          default: ''
          maxLength: 150
        puede_cobrar:
          type: boolean
          default: false
        puede_ver_reportes:
          type: boolean
          default: false
        puede_editar_precios:
          type: boolean
          default: false
        puede_gestionar_empleados:
          type: boolean
          default: false
        puede_gestionar_agenda:
          type: boolean
          default: false
      required:
      - email
      - nombre
      - password
    EstadoEnum:
      enum:
      - agendada
      - confirmada
      - completada
      - cancelada
      type: string
      description: |-
        * `agendada` - Agendada
        * `confirmada` - Confirmada
        * `completada` - Completada
        * `cancelada` - Cancelada
    HorarioTrabajo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        miembro:
          type: integer
        dia_semana:
          allOf:
          - $ref: '#/components/schemas/DiaSemanaEnum'
          minimum: -2147483648
          maximum: 2147483647
        hora_inicio:
          type: string
          format: time
        hora_fin:
          type: string
          format: time
      required:
      - dia_semana
      - hora_fin
      - hora_inicio
      - id
      - miembro
    MiMembresia:
      type: object
      description: |-
        Forma de la respuesta de GET /api/negocios/mi-membresia/.

        Pensado para que el frontend, justo después de loguearse, resuelva
        en un solo request "quién soy, en qué negocio y qué puedo hacer"
        sin tener que listar empleados y buscarse a sí mismo por email.
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        nombre:
          type: string
          readOnly: true
        especialidad:
          type: string
          readOnly: true
        negocio:
          allOf:
          - $ref: '#/components/schemas/Negocio'
          readOnly: true
        puede_cobrar:
          type: boolean
          readOnly: true
        puede_ver_reportes:
          type: boolean
          readOnly: true
        puede_editar_precios:
          type: boolean
          readOnly: true
        puede_gestionar_empleados:
          type: boolean
          readOnly: true
        puede_gestionar_agenda:
          type: boolean
          readOnly: true
        activo:
          type: boolean
          readOnly: true
      required:
      - activo
      - email
      - especialidad
      - id
      - negocio
      - nombre
      - puede_cobrar
      - puede_editar_precios
      - puede_gestionar_agenda
      - puede_gestionar_empleados
      - puede_ver_reportes
    MiembroNegocio:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        nombre:
          type: string
          readOnly: true
        especialidad:
          type: string
          maxLength: 150
        puede_cobrar:
          type: boolean
        puede_ver_reportes:
          type: boolean
        puede_editar_precios:
          type: boolean
        puede_gestionar_empleados:
          type: boolean
        puede_gestionar_agenda:
          type: boolean
        activo:
          type: boolean
      required:
      - email
      - id
      - nombre
    Negocio:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        ciudad:
          type: string
          readOnly: true
        direccion:
          type: string
          readOnly: true
        telefono:
          type: string
          readOnly: true
        activo:
          type: boolean
          readOnly: true
      required:
      - activo
      - ciudad
      - direccion
      - id
      - nombre
      - slug
      - telefono
    PatchedCita:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        servicio:
          type: integer
        servicio_nombre:
          type: string
          readOnly: true
        empleado:
          type: integer
        empleado_nombre:
          type: string
          readOnly: true
        fecha_hora_inicio:
          type: string
          format: date-time
        fecha_hora_fin:
          type: string
          format: date-time
          readOnly: true
        estado:
          allOf:
          - $ref: '#/components/schemas/EstadoEnum'
          readOnly: true
        nombre_cliente:
          type: string
          maxLength: 150
        telefono_cliente:
          type: string
          maxLength: 30
        notas:
          type: string
    PatchedHorarioTrabajo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        miembro:
          type: integer
        dia_semana:
          allOf:
          - $ref: '#/components/schemas/DiaSemanaEnum'
          minimum: -2147483648
          maximum: 2147483647
        hora_inicio:
          type: string
          format: time
        hora_fin:
          type: string
          format: time
    PatchedMiembroNegocio:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        nombre:
          type: string
          readOnly: true
        especialidad:
          type: string
          maxLength: 150
        puede_cobrar:
          type: boolean
        puede_ver_reportes:
          type: boolean
        puede_editar_precios:
          type: boolean
        puede_gestionar_empleados:
          type: boolean
        puede_gestionar_agenda:
          type: boolean
        activo:
          type: boolean
    PatchedServicio:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 150
        descripcion:
          type: string
        categoria:
          type: string
          maxLength: 100
        precio:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        duracion_minutos:
          type: integer
          maximum: 2147483647
          minimum: 0
        porcentaje_comision:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        activo:
          type: boolean
    RegistroNegocio:
      type: object
      properties:
        nombre_negocio:
          type: string
          maxLength: 150
        ciudad:
          type: string
          maxLength: 100
        direccion:
          type: string
          maxLength: 255
        telefono:
          type: string
          maxLength: 30
        email_dueno:
          type: string
          format: email
        nombre_dueno:
          type: string
          maxLength: 150
        password_dueno:
          type: string
          writeOnly: true
        empleados:
          type: array
          items:
            $ref: '#/components/schemas/EmpleadoAlta'
      required:
      - email_dueno
      - nombre_dueno
      - nombre_negocio
      - password_dueno
    RegistroNegocioRespuesta:
      type: object
      description: Forma de la respuesta de POST /api/negocios/registro/.
      properties:
        negocio:
          $ref: '#/components/schemas/Negocio'
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - negocio
      - refresh
    Servicio:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 150
        descripcion:
          type: string
        categoria:
          type: string
          maxLength: 100
        precio:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        duracion_minutos:
          type: integer
          maximum: 2147483647
          minimum: 0
        porcentaje_comision:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        activo:
          type: boolean
      required:
      - duracion_minutos
      - id
      - nombre
      - precio
    TokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - email
      - password
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
