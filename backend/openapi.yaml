components:
  schemas:
    Cargo:
      type: object
      description: |-
        Un cargo del negocio: nombre, tipo y qué concede.

        `miembros` sirve para que la UI avise antes de borrar y para explicar
        a cuánta gente afecta editarlo — que es la contrapartida de que el
        cargo sea la única fuente de verdad.
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 80
        tipo:
          $ref: '#/components/schemas/TipoEnum'
        miembros:
          type: integer
          readOnly: true
        puede_cobrar:
          type: boolean
        puede_ver_reportes:
          type: boolean
        puede_editar_precios:
          type: boolean
        puede_gestionar_empleados:
          type: boolean
        puede_gestionar_agenda:
          type: boolean
        puede_configurar_horarios:
          type: boolean
        puede_ver_agenda_completa:
          type: boolean
        puede_editar_negocio:
          type: boolean
        puede_aprobar_servicios:
          type: boolean
      required:
      - id
      - miembros
      - nombre
    Cita:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        servicio:
          type: integer
        servicio_nombre:
          type: string
          readOnly: true
        empleado:
          type: integer
        empleado_nombre:
          type: string
          readOnly: true
        fecha_hora_inicio:
          type: string
          format: date-time
        fecha_hora_fin:
          type: string
          format: date-time
          readOnly: true
        estado:
          allOf:
          - $ref: '#/components/schemas/CitaEstadoEnum'
          readOnly: true
        nombre_cliente:
          type: string
          maxLength: 150
        telefono_cliente:
          type: string
          maxLength: 30
        notas:
          type: string
      required:
      - empleado
      - empleado_nombre
      - estado
      - fecha_hora_fin
      - fecha_hora_inicio
      - id
      - nombre_cliente
      - servicio
      - servicio_nombre
    CitaCreate:
      type: object
      description: |-
        Entrada para agendar una cita. `empleado` es opcional: si se
        omite, se asigna automáticamente el primer empleado disponible.
      properties:
        servicio:
          type: integer
        empleado:
          type: integer
          nullable: true
        fecha_hora_inicio:
          type: string
          format: date-time
        nombre_cliente:
          type: string
          maxLength: 150
        telefono_cliente:
          type: string
          default: ''
          maxLength: 30
        notas:
          type: string
          default: ''
      required:
      - fecha_hora_inicio
      - nombre_cliente
      - servicio
    CitaEstadoEnum:
      enum:
      - agendada
      - confirmada
      - completada
      - cancelada
      type: string
      description: |-
        * `agendada` - Agendada
        * `confirmada` - Confirmada
        * `completada` - Completada
        * `cancelada` - Cancelada
    DiaSemanaEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
      description: |-
        * `0` - Lunes
        * `1` - Martes
        * `2` - Miércoles
        * `3` - Jueves
        * `4` - Viernes
        * `5` - Sábado
        * `6` - Domingo
    EmpleadoAlta:
      type: object
      description: 'Empleado adicional: sus datos de acceso y en qué cargo entra.'
      properties:
        email:
          type: string
          format: email
        nombre:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
        especialidad:
          type: string
          default: ''
          maxLength: 150
        cargo:
          type: integer
          nullable: true
      required:
      - email
      - nombre
      - password
    EmpleadoAltaRegistro:
      type: object
      description: |-
        Empleado dado de alta **dentro del registro del negocio**.

        Sin `cargo` a propósito: en ese request los cargos del negocio todavía
        no existen, así que un id solo podría apuntar a otro negocio. Estos
        empleados entran al cargo operativo sembrado y el dueño les cambia el
        cargo después, ya autenticado.
      properties:
        email:
          type: string
          format: email
        nombre:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
        especialidad:
          type: string
          default: ''
          maxLength: 150
      required:
      - email
      - nombre
      - password
    FotoNegocio:
      type: object
      description: |-
        Una foto de la galería. `orden` no se escribe acá: lo fija
        `PUT .../fotos/orden/` sobre la lista completa.
      properties:
        id:
          type: integer
          readOnly: true
        imagen:
          type: string
          format: uri
        orden:
          type: integer
          readOnly: true
      required:
      - id
      - imagen
      - orden
    FotoPublica:
      type: object
      description: |-
        Una foto de la galería, como la consume el carrusel del perfil.

        `orden` viaja aunque la lista ya venga ordenada: el frontend lo usa
        como `key` estable y para no depender de que el backend nunca cambie
        su criterio de ordenamiento.
      properties:
        id:
          type: integer
          readOnly: true
        imagen:
          type: string
          format: uri
          readOnly: true
        orden:
          type: integer
          readOnly: true
      required:
      - id
      - imagen
      - orden
    FranjaHorario:
      type: object
      description: |-
        Una franja suelta dentro de la semana. Sin `miembro`: lo define el
        contenedor, para no repetirlo en cada elemento de la lista.
      properties:
        dia_semana:
          $ref: '#/components/schemas/DiaSemanaEnum'
        hora_inicio:
          type: string
          format: time
        hora_fin:
          type: string
          format: time
      required:
      - dia_semana
      - hora_fin
      - hora_inicio
    HorarioNegocio:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        dia_semana:
          allOf:
          - $ref: '#/components/schemas/DiaSemanaEnum'
          minimum: -2147483648
          maximum: 2147483647
        hora_inicio:
          type: string
          format: time
        hora_fin:
          type: string
          format: time
      required:
      - dia_semana
      - hora_fin
      - hora_inicio
      - id
    HorarioNegocioPublico:
      type: object
      properties:
        dia_semana:
          allOf:
          - $ref: '#/components/schemas/DiaSemanaEnum'
          readOnly: true
        hora_inicio:
          type: string
          format: time
          readOnly: true
        hora_fin:
          type: string
          format: time
          readOnly: true
      required:
      - dia_semana
      - hora_fin
      - hora_inicio
    HorarioNegocioSemanal:
      type: object
      description: |-
        Entrada de `PUT /api/agenda/horario-negocio/`.

        Solo `franjas`: el negocio sale del token, nunca del body (ver
        CONTRATO.md sección 5.5). Semántica de reemplazo, igual que el horario
        por empleado.
      properties:
        franjas:
          type: array
          items:
            $ref: '#/components/schemas/FranjaHorario'
      required:
      - franjas
    HorarioSemanal:
      type: object
      description: |-
        Entrada de `PUT /api/agenda/horarios/semana/`.

        `miembros` es una lista porque lo normal es que todo el equipo comparta
        el mismo horario; un solo empleado es el caso n=1, no una forma aparte.
        Va vacía nunca: sin destinatarios no hay nada que aplicar.

        Semántica de reemplazo: la lista de franjas es el horario completo de
        **cada** empleado señalado, no un agregado. Mandar `franjas: []` los
        deja sin disponibilidad.
      properties:
        miembros:
          type: array
          items:
            type: integer
        franjas:
          type: array
