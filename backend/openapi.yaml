            schema:
              $ref: '#/components/schemas/RegistroNegocio'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegistroNegocio'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroNegocioRespuesta'
          description: ''
