  /api/negocios/empleados/:
    get:
      operationId: negocios_empleados_list
      description: |-
        Lista o agrega empleados del negocio del usuario autenticado.

        El queryset se filtra siempre por el negocio de la membresía activa
        del solicitante: nunca se exponen empleados de otro tenant.
      tags:
      - negocios
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MiembroNegocio'
          description: ''
    post:
      operationId: negocios_empleados_create
      description: |-
        Lista o agrega empleados del negocio del usuario autenticado.

        El queryset se filtra siempre por el negocio de la membresía activa
        del solicitante: nunca se exponen empleados de otro tenant.
      tags:
      - negocios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmpleadoAlta'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmpleadoAlta'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmpleadoAlta'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiembroNegocio'
          description: ''
  /api/negocios/empleados/{id}/:
    get:
      operationId: negocios_empleados_retrieve
      description: |-
        Detalle y edición de un empleado puntual del negocio.

        Editar (capacidades, especialidad, activo) requiere
        `puede_gestionar_empleados`; ver el detalle solo requiere
        pertenecer al negocio. Nunca expone empleados de otro tenant: el
        queryset ya viene acotado al negocio de la membresía del
        solicitante.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - negocios
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiembroNegocio'
          description: ''
    put:
      operationId: negocios_empleados_update
      description: |-
        Detalle y edición de un empleado puntual del negocio.

        Editar (capacidades, especialidad, activo) requiere
        `puede_gestionar_empleados`; ver el detalle solo requiere
        pertenecer al negocio. Nunca expone empleados de otro tenant: el
        queryset ya viene acotado al negocio de la membresía del
        solicitante.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - negocios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MiembroNegocio'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MiembroNegocio'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MiembroNegocio'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiembroNegocio'
          description: ''
    patch:
      operationId: negocios_empleados_partial_update
      description: |-
        Detalle y edición de un empleado puntual del negocio.

        Editar (capacidades, especialidad, activo) requiere
        `puede_gestionar_empleados`; ver el detalle solo requiere
        pertenecer al negocio. Nunca expone empleados de otro tenant: el
        queryset ya viene acotado al negocio de la membresía del
        solicitante.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - negocios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMiembroNegocio'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMiembroNegocio'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMiembroNegocio'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiembroNegocio'
          description: ''
  /api/negocios/mi-membresia/:
    get:
      operationId: negocios_mi_membresia_retrieve
      description: |-
        Quién soy, en qué negocio y qué puedo hacer.

        Pensado para que el frontend lo llame justo después de loguearse
        (o al recuperar sesión desde tokens guardados) y resuelva de una
        sola vez sus propias capacidades + los datos del negocio, sin
        tener que listar empleados y buscarse a sí mismo por email.
      tags:
      - negocios
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiMembresia'
          description: ''
  /api/negocios/registro/:
    post:
      operationId: negocios_registro_create
      description: |-
        Alta de un negocio nuevo, con su dueño (todas las capacidades) y,
        opcionalmente, empleados adicionales desde el mismo registro.
      tags:
      - negocios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroNegocio'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegistroNegocio'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegistroNegocio'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroNegocioRespuesta'
          description: ''
  /api/servicios/:
    get:
      operationId: servicios_list
      description: |-
        CRUD de servicios del negocio del usuario autenticado.

        Leer requiere solo pertenecer al negocio; crear/editar/borrar
        requiere la capacidad `puede_editar_precios`, porque un servicio
        define precio y comisión.
      tags:
      - servicios
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
