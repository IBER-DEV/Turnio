      description: |-
        Reserva una cita sin necesidad de cuenta: basta nombre y teléfono. Es el reemplazo directo de llamar o escribir por WhatsApp.

        `empleado` es opcional: si se omite, se asigna quien esté disponible. Si el hueco se ocupó entre que se mostró y se confirmó —dos clientes reservando a la vez— responde `400`, no una cita encima de otra.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - publico
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reserva'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Reserva'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Reserva'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservaConfirmada'
          description: ''
