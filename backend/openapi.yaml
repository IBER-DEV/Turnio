components:
  schemas:
    Cita:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        servicio:
          type: integer
        servicio_nombre:
          type: string
          readOnly: true
        empleado:
          type: integer
        empleado_nombre:
          type: string
          readOnly: true
        fecha_hora_inicio:
          type: string
          format: date-time
        fecha_hora_fin:
          type: string
          format: date-time
          readOnly: true
        estado:
          allOf:
          - $ref: '#/components/schemas/EstadoEnum'
          readOnly: true
        nombre_cliente:
          type: string
          maxLength: 150
        telefono_cliente:
          type: string
          maxLength: 30
        notas:
          type: string
      required:
      - empleado
      - empleado_nombre
      - estado
      - fecha_hora_fin
      - fecha_hora_inicio
      - id
      - nombre_cliente
      - servicio
      - servicio_nombre
    CitaCreate:
      type: object
      description: |-
        Entrada para agendar una cita. `empleado` es opcional: si se
        omite, se asigna automáticamente el primer empleado disponible.
      properties:
        servicio:
          type: integer
        empleado:
          type: integer
          nullable: true
        fecha_hora_inicio:
          type: string
          format: date-time
        nombre_cliente:
          type: string
          maxLength: 150
        telefono_cliente:
          type: string
          default: ''
          maxLength: 30
        notas:
          type: string
          default: ''
      required:
      - fecha_hora_inicio
      - nombre_cliente
      - servicio
    DiaSemanaEnum:
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      type: integer
      description: |-
        * `0` - Lunes
        * `1` - Martes
        * `2` - Miércoles
        * `3` - Jueves
        * `4` - Viernes
        * `5` - Sábado
        * `6` - Domingo
    EmpleadoAlta:
      type: object
      description: Empleado adicional dado de alta junto con el registro del negocio.
      properties:
        email:
          type: string
          format: email
        nombre:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
        especialidad:
          type: string
          default: ''
          maxLength: 150
        puede_cobrar:
          type: boolean
          default: false
        puede_ver_reportes:
          type: boolean
          default: false
        puede_editar_precios:
          type: boolean
          default: false
        puede_gestionar_empleados:
          type: boolean
          default: false
        puede_gestionar_agenda:
          type: boolean
          default: false
        puede_configurar_horarios:
          type: boolean
          default: false
        puede_ver_agenda_completa:
          type: boolean
          default: false
      required:
      - email
      - nombre
      - password
    EstadoEnum:
      enum:
      - agendada
      - confirmada
      - completada
      - cancelada
      type: string
      description: |-
        * `agendada` - Agendada
        * `confirmada` - Confirmada
        * `completada` - Completada
        * `cancelada` - Cancelada
    FranjaHorario:
      type: object
      description: |-
        Una franja suelta dentro de la semana. Sin `miembro`: lo define el
        contenedor, para no repetirlo en cada elemento de la lista.
      properties:
        dia_semana:
          $ref: '#/components/schemas/DiaSemanaEnum'
        hora_inicio:
          type: string
          format: time
        hora_fin:
          type: string
          format: time
      required:
      - dia_semana
      - hora_fin
      - hora_inicio
    HorarioNegocio:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        dia_semana:
          allOf:
          - $ref: '#/components/schemas/DiaSemanaEnum'
          minimum: -2147483648
          maximum: 2147483647
        hora_inicio:
          type: string
          format: time
        hora_fin:
          type: string
          format: time
      required:
      - dia_semana
      - hora_fin
      - hora_inicio
      - id
    HorarioNegocioSemanal:
      type: object
      description: |-
        Entrada de `PUT /api/agenda/horario-negocio/`.

        Solo `franjas`: el negocio sale del token, nunca del body (ver
        CONTRATO.md sección 5.5). Semántica de reemplazo, igual que el horario
        por empleado.
      properties:
        franjas:
          type: array
          items:
            $ref: '#/components/schemas/FranjaHorario'
      required:
      - franjas
    HorarioSemanal:
      type: object
      description: |-
        Entrada de `PUT /api/agenda/horarios/semana/`.

        `miembros` es una lista porque lo normal es que todo el equipo comparta
        el mismo horario; un solo empleado es el caso n=1, no una forma aparte.
        Va vacía nunca: sin destinatarios no hay nada que aplicar.

        Semántica de reemplazo: la lista de franjas es el horario completo de
        **cada** empleado señalado, no un agregado. Mandar `franjas: []` los
        deja sin disponibilidad.
      properties:
        miembros:
          type: array
          items:
            type: integer
        franjas:
          type: array
          items:
            $ref: '#/components/schemas/FranjaHorario'
      required:
      - franjas
      - miembros
    HorarioTrabajo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        miembro:
          type: integer
        dia_semana:
          allOf:
          - $ref: '#/components/schemas/DiaSemanaEnum'
          minimum: -2147483648
          maximum: 2147483647
        hora_inicio:
          type: string
          format: time
        hora_fin:
          type: string
          format: time
      required:
      - dia_semana
      - hora_fin
      - hora_inicio
      - id
      - miembro
    MiMembresia:
      type: object
      description: |-
        Forma de la respuesta de GET /api/negocios/mi-membresia/.

        Pensado para que el frontend, justo después de loguearse, resuelva
        en un solo request "quién soy, en qué negocio y qué puedo hacer"
        sin tener que listar empleados y buscarse a sí mismo por email.
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        nombre:
          type: string
          readOnly: true
        especialidad:
          type: string
          readOnly: true
        negocio:
          allOf:
          - $ref: '#/components/schemas/Negocio'
          readOnly: true
        puede_cobrar:
          type: boolean
          readOnly: true
        puede_ver_reportes:
          type: boolean
          readOnly: true
        puede_editar_precios:
          type: boolean
          readOnly: true
        puede_gestionar_empleados:
          type: boolean
          readOnly: true
        puede_gestionar_agenda:
          type: boolean
          readOnly: true
        puede_configurar_horarios:
          type: boolean
          readOnly: true
        puede_ver_agenda_completa:
          type: boolean
          readOnly: true
        activo:
          type: boolean
          readOnly: true
      required:
      - activo
      - email
      - especialidad
      - id
      - negocio
      - nombre
      - puede_cobrar
      - puede_configurar_horarios
      - puede_editar_precios
      - puede_gestionar_agenda
      - puede_gestionar_empleados
      - puede_ver_agenda_completa
      - puede_ver_reportes
    MiembroEquipo:
      type: object
      description: |-
        Vista mínima de un compañero de trabajo, para quien NO gestiona
        el equipo.

        Existe porque la agenda necesita listar empleados (filtrar el
        calendario, elegir a quién asignar una cita, cargar horarios), pero
        eso no justifica exponerle a cualquier miembro el email y la matriz
        de capacidades de todos sus compañeros — que es lo que hacía
        `MiembroNegocioSerializer` cuando se usaba para listar sin exigir
        `puede_gestionar_empleados`.

        Deliberadamente sin `email` ni flags `puede_*`.
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          readOnly: true
        especialidad:
          type: string
          readOnly: true
        activo:
          type: boolean
          readOnly: true
      required:
      - activo
      - especialidad
      - id
      - nombre
    MiembroNegocio:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        nombre:
          type: string
          readOnly: true
        especialidad:
          type: string
          maxLength: 150
        puede_cobrar:
          type: boolean
        puede_ver_reportes:
          type: boolean
        puede_editar_precios:
          type: boolean
        puede_gestionar_empleados:
          type: boolean
        puede_gestionar_agenda:
          type: boolean
        puede_configurar_horarios:
          type: boolean
        puede_ver_agenda_completa:
          type: boolean
        activo:
          type: boolean
      required:
      - email
      - id
      - nombre
    Negocio:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        ciudad:
          type: string
          readOnly: true
        direccion:
          type: string
          readOnly: true
        telefono:
          type: string
          readOnly: true
        activo:
          type: boolean
          readOnly: true
      required:
      - activo
      - ciudad
      - direccion
      - id
      - nombre
      - slug
      - telefono
    PatchedCita:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        servicio:
          type: integer
        servicio_nombre:
          type: string
          readOnly: true
        empleado:
          type: integer
        empleado_nombre:
          type: string
          readOnly: true
        fecha_hora_inicio:
          type: string
          format: date-time
        fecha_hora_fin:
          type: string
          format: date-time
          readOnly: true
        estado:
          allOf:
          - $ref: '#/components/schemas/EstadoEnum'
          readOnly: true
        nombre_cliente:
          type: string
          maxLength: 150
        telefono_cliente:
          type: string
          maxLength: 30
        notas:
          type: string
    PatchedHorarioTrabajo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        miembro:
          type: integer
        dia_semana:
          allOf:
          - $ref: '#/components/schemas/DiaSemanaEnum'
          minimum: -2147483648
          maximum: 2147483647
        hora_inicio:
          type: string
          format: time
        hora_fin:
          type: string
          format: time
