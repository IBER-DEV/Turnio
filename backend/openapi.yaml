            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HorarioTrabajo'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
