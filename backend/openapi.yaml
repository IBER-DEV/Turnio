            application/json:
              schema:
                $ref: '#/components/schemas/NegocioPublico'
          description: ''
  /api/publico/negocios/{slug}/disponibilidad/:
    get:
      operationId: publico_negocios_disponibilidad_list
      description: |-
        Las horas libres para un servicio en un día. Público, sin autenticación.

        **No cachear**: cambia con cada reserva. Devuelve solo horas futuras, y nunca revela quién está ocupado ni con quién — las citas existentes se usan para descartar huecos y nada más.
      parameters:
      - in: query
        name: fecha
        schema:
          type: string
        description: Día a consultar (YYYY-MM-DD).
        required: true
      - in: query
        name: servicio
        schema:
          type: integer
        description: Id del servicio.
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - publico
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hueco'
          description: ''
