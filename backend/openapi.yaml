  /api/agenda/citas/{id}/confirmar/:
    post:
      operationId: agenda_citas_confirmar_create
      description: |-
        Agenda: crear y consultar citas, y transicionar su estado.

        Crear requiere `puede_gestionar_agenda`. `empleado` es opcional al
