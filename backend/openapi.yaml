      description: |-
        * `administracion` - Administración
        * `recepcion` - Recepción
        * `operativo` - Operativo
    TokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
