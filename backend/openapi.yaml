      type: object
      description: |-
        Entrada de `POST .../registros/{id}/rechazar/`: el motivo es
        obligatorio — es lo que el empleado va a leer en su propio historial.
      properties:
        motivo:
          type: string
          maxLength: 500
      required:
      - motivo
    RegistroNegocio:
      type: object
