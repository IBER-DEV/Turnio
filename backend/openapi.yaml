        Ya no lleva flags `puede_*`: las capacidades viven en el cargo. Se
        envía `cargo` (el id, que es lo editable) y `cargo_detalle` anidado
        para que la UI muestre el nombre y lo que concede sin un segundo
        request.
      properties:
        id:
          type: integer
