          format: email
          readOnly: true
        nombre:
          type: string
          readOnly: true
        especialidad:
          type: string
          maxLength: 150
        cargo:
          type: integer
          nullable: true
        cargo_detalle:
          allOf:
          - $ref: '#/components/schemas/Cargo'
          readOnly: true
        activo:
          type: boolean
      required:
      - cargo_detalle
      - email
      - id
      - nombre
    Negocio:
