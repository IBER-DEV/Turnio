        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Servicio'
          description: ''
    patch:
      operationId: servicios_partial_update
      description: |-
        CRUD de servicios del negocio del usuario autenticado.

