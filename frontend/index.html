<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: necesario para que env(safe-area-inset-*)
         funcione dentro del contenedor nativo de Capacitor. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Tiñe la barra de estado del sistema, que en la app queda pegada
         al encabezado indigo. Con el casi-blanco que había acá se veía
         una franja clara sobre el indigo justo donde está la isla
         dinámica / la hora: la app no llegaba hasta el borde de la
         pantalla. Va el mismo `--color-primary` del encabezado.

         El perfil público **no** se ve afectado: `apps/publico/
         views_shell.py` borra esta meta y pone la del tema del negocio
         (barbería oscura, spa clara, clínica clara) antes de servir el
         HTML. Lo hace por regex sobre el nombre, no sobre el valor, así
         que cambiar este color no toca ese camino. -->
    <meta name="theme-color" content="#1e1b4b" />
    <title>Turnio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
