services:
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - turnio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: .env
    volumes:
      - ./backend:/app
      # PerfilPublicoShellView (apps/publico/views_shell.py) lee
      # frontend/dist/index.html para inyectar las meta tags Open Graph
      # del perfil público. Sin este montaje, WORKDIR /app hace que
      # `BASE_DIR.parent / "frontend"` no exista dentro del contenedor y
      # esa vista daría 404 siempre, aunque `npm run build` sí se haya
      # corrido en el host. Solo `dist/` (no todo `frontend/`, que
      # arrastraría `node_modules`), y de solo lectura: el backend nunca
      # escribe acá.
      - ./frontend/dist:/frontend/dist:ro
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  turnio_postgres_data:
